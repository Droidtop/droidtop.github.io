# Builds droidtop.github.io from the official catalog's index.json and deploys it with GitHub Pages.
name: Pages

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  INDEX: https://raw.githubusercontent.com/droidtop/droidtop-platforms/main/droidtop-plugins/index.json
  REGISTRY: https://raw.githubusercontent.com/Droidtop/droidtop/main/plugin-host/src/main/kotlin/dev/droidtop/pluginhost/PluginPermissions.kt

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test the generator and the link script
        run: |
          python3 generator/test_build_site.py
          node --test generator/test_link.js
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build the site
        run: python3 generator/build_site.py --index "$INDEX" --address "$INDEX" --registry "$REGISTRY" --forward-pages --out _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
